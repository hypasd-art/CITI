### model
model_name_or_path: /mnt/publiccache/huggingface/Mistral-7B-Instruct-v0.2
model_type: CITI
print_param_status: True

### CITI config
moelora_allocation: /mnt/publiccache/yphao/model/moelora_allocation/mistral_moe_allocation_top_20_percent.json
moe_type: backbone
blc_weight: 0.01
moelora_dropout: 0.0
lora_nums: 4
moelora_rank: 8
moelora_alpha: 2
blc_alpha: 0.95
training_stage: stage_1
using_task_types: True

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: apibank_training_chat_merge
template: mistral_tool
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
only_train_on_last_round: True

### output
output_dir: /mnt/publiccache/yphao/model/apibank/apibank_mix_mistral_instruct_CITI_stage_1
logging_steps: 10
save_steps: 2000
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000

### eval
