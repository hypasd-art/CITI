### model
model_name_or_path: /mnt/publiccache/huggingface/Phi-3-mini-128k-instruct
model_type: CITI
print_param_status: True
new_special_tokens: <|tool|>

### CITI config
peft_path: /mnt/publiccache/yphao/model/toolalpaca/toolalpaca_mix_phi3_instruct_CITI_stage_2
moelora_allocation: /mnt/publiccache/yphao/model/toolalpaca_moelora_allocation/phi3_moe_allocation_top_20_percent.json
moe_type: backbone
blc_weight: 0.01
moelora_dropout: 0.0
lora_nums: 4
moelora_rank: 8
moelora_alpha: 2
blc_alpha: 0.95
training_stage: stage_3
using_task_types: True
unfreeze_module: /mnt/publiccache/yphao/model/toolalpaca_moelora_allocation/phi3_unfreeze_down_10.json

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: toolalpaca_training_chat_merge
template: phi_toolalpaca
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
only_train_on_last_round: True

### output
output_dir: /mnt/publiccache/yphao/model/toolalpaca/toolalpaca_mix_phi3_instruct_CITI_stage_3
logging_steps: 10
save_steps: 2000
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000

