### model
model_name_or_path: /mnt/publiccache/huggingface/Meta-Llama-3-8B-Instruct
model_type: llama

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: apibank_training_chat
template: llama3
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
only_train_on_last_round: True

### output
output_dir: /mnt/publiccache/yphao/model/apibank/apibank_llama3_instruct_full_2
logging_steps: 10
save_steps: 2000
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000

# ### eval
# val_size: 0.1
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500

### other 
report_to: none
